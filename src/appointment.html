<style>

  .nav-link::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1.5px;background:#D64000;transition:width .25s cubic-bezier(.4,0,.2,1)}
  .nav-link:hover{color:#D64000}.nav-link:hover::after{width:100%}
  .btn-primary{display:inline-flex;align-items:center;gap:.5rem;padding:.875rem 2rem;background:#1A1710;color:#FAF6EE;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;border:none;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background .2s;box-shadow:0 4px 16px rgba(26,23,16,.18)}
  .btn-primary:hover{background:#D64000;transform:translateY(-2px);box-shadow:0 8px 24px rgba(214,64,0,.28)}
  .btn-primary:disabled{background:#C4BFB5;cursor:not-allowed;transform:none;box-shadow:none}

  .date-btn{display:flex;flex-direction:column;align-items:center;padding:.6rem .5rem;border:1px solid rgba(26,23,16,.12);background:#FAF6EE;cursor:pointer;transition:all .2s;min-width:52px;gap:.15rem}
  .date-btn:hover:not(:disabled){border-color:#D64000;background:rgba(214,64,0,.04)}
  .date-btn.active{background:#1A1710;border-color:#1A1710;color:#FAF6EE}
  .date-btn:disabled{opacity:.35;cursor:not-allowed;background:#F0EBE0}
  .date-btn .day-label{font-family:'Inter',sans-serif;font-size:.62rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:inherit}
  .date-btn .day-num{font-family:'Inter',sans-serif;font-size:1.1rem;font-weight:600;color:inherit;line-height:1}
  .date-btn.active .day-label,.date-btn.active .day-num{color:#FAF6EE}

  .session-card{border:1px solid rgba(26,23,16,.1);padding:1.25rem 1.5rem;background:#FAF6EE;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s;gap:1rem}
  .session-card:hover:not(.unavailable):not(.selected){border-color:#D64000;background:rgba(214,64,0,.03)}
  .session-card.selected{border-color:#1A1710;background:#1A1710}
  .session-card.selected *{color:#FAF6EE!important}
  .session-card.unavailable{opacity:.5;cursor:not-allowed}

  .availability-badge{font-family:'Inter',sans-serif;font-size:1.4rem;font-weight:700;line-height:1;min-width:32px;text-align:center}
  .availability-badge.open{color:#2D7A3A}
  .availability-badge.full{color:#D64000}
  .session-card.selected .availability-badge{color:#FAF6EE!important}

  .form-input{width:100%;padding:.75rem 1rem;border:1px solid rgba(26,23,16,.15);background:#FAF6EE;font-family:'Noto Sans TC',sans-serif;font-size:.9rem;color:#1A1710;outline:none;transition:border-color .2s}
  .form-input:focus{border-color:#1A1710}

  #booking-form-section{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0}
  #booking-form-section.open{max-height:1000px;opacity:1}

  .radio-group{display:flex;gap:.75rem;}
  .radio-opt{display:flex;align-items:center;gap:.5rem;cursor:pointer;padding:.65rem 1.1rem;border:1px solid rgba(26,23,16,.15);flex:1;transition:all .2s;}
  .radio-opt:hover{border-color:#1A1710;}
  .radio-opt input{accent-color:#1A1710;}
  .radio-opt.checked{border-color:#1A1710;background:#1A1710;}
  .radio-opt.checked span{color:#FAF6EE;}
  .radio-opt span{font-size:.88rem;font-family:'Noto Sans TC',sans-serif;color:#1A1710;}

  #success-card{display:none}
  #success-card.show{display:block}

  .spinner{width:20px;height:20px;border:2px solid rgba(250,246,238,.3);border-top-color:#FAF6EE;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  #mobile-menu{display:none}#mobile-menu.open{display:flex}
</style>

<script>
// ── CONFIG — replace with your deployed Apps Script URL ────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyH9DilFvRAXs8we-eAOL1hLygTMapUF7nnbYb3-DB-yrHjQXoyLGTnS-GHwSphIZ4pBQ/exec';
// ──────────────────────────────────────────────────────────────────────────

const DAY_NAMES = ['日','一','二','三','四','五','六'];
const SESSION_LABELS = { '早診':'早診','午診':'午診','夜診':'夜診' };

let selectedDate      = null;
let selectedSession   = null;
let selectedVisitType = null;
let fetchController   = null;

function selectVisitType(type, el) {
  selectedVisitType = type;
  document.querySelectorAll('.radio-opt').forEach(o => o.classList.remove('checked'));
  el.classList.add('checked');
}

// Nav scroll
const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  navbar.style.borderBottomColor = window.scrollY > 60 ? 'rgba(26,23,16,.1)' : 'transparent';
  navbar.style.boxShadow = window.scrollY > 60 ? '0 4px 24px rgba(26,23,16,.08)' : 'none';
});
document.getElementById('menu-btn').addEventListener('click', () =>
  document.getElementById('mobile-menu').classList.toggle('open'));

// ── Build date strip (today + 13 days) ────────────────────────────────────
function buildDateStrip() {
  const strip = document.getElementById('date-strip');
  const today = new Date();
  today.setHours(0,0,0,0);

  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const isSunday  = d.getDay() === 0;
    const dateStr   = toDateStr(d);
    const isToday   = i === 0;

    const btn = document.createElement('button');
    btn.className   = 'date-btn' + (isSunday ? ' ' : '');
    btn.disabled    = isSunday;
    btn.dataset.date = dateStr;
    btn.innerHTML   = `
      <span class="day-label">${isToday ? '今日' : '週' + DAY_NAMES[d.getDay()]}</span>
      <span class="day-num">${d.getDate()}</span>
      <span style="font-size:.6rem;font-family:'Inter',sans-serif;opacity:.55;">${d.getMonth()+1}/${d.getDate()}</span>
    `;
    btn.addEventListener('click', () => selectDate(dateStr, btn));
    strip.appendChild(btn);
  }

  // Auto-select first non-Sunday
  const first = strip.querySelector('.date-btn:not(:disabled)');
  if (first) first.click();
}

function selectDate(dateStr, btn) {
  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedDate = dateStr;
  selectedSession = null;
  closeForm();
  loadSessions(dateStr);
}

// ── Load sessions ─────────────────────────────────────────────────────────
async function loadSessions(date) {
  // Cancel any previous in-flight request
  if (fetchController) fetchController.abort();
  fetchController = new AbortController();
  const { signal } = fetchController;

  const section  = document.getElementById('sessions-section');
  const list     = document.getElementById('sessions-list');
  const loading  = document.getElementById('sessions-loading');
  const closed   = document.getElementById('sessions-closed');

  section.style.display = 'block';
  list.innerHTML        = '';
  loading.style.display = 'block';
  closed.style.display  = 'none';

  try {
    const url  = `${SCRIPT_URL}?action=availability&date=${date}`;
    const resp = await fetch(url, { signal });
    const data = await resp.json();

    loading.style.display = 'none';

    if (!data.availability || data.availability.length === 0) {
      closed.style.display = 'block';
      return;
    }

    data.availability.forEach(s => {
      const card = document.createElement('div');
      card.className = 'session-card' + (s.available ? '' : ' unavailable');
      card.dataset.session = s.session;
      card.innerHTML = `
        <div>
          <div style="font-family:'Noto Serif TC',serif;font-weight:700;font-size:1.1rem;color:#1A1710;margin-bottom:.2rem;">${s.session}</div>
          <div style="font-family:'Inter',sans-serif;font-size:.78rem;color:#7A7568;">${s.time}</div>
        </div>
        <div style="display:flex;align-items:center;gap:1rem;">
          <div style="text-align:right;">
            <div style="font-size:.68rem;color:#C4BFB5;font-family:'Inter',sans-serif;">${s.booked}/${s.capacity}</div>
          </div>
          <div class="availability-badge ${s.available ? 'open' : 'full'}">${s.available ? '○' : '✕'}</div>
        </div>
      `;
      if (s.available) {
        card.addEventListener('click', () => selectSession(s, card));
      }
      list.appendChild(card);
    });

  } catch (e) {
    if (e.name === 'AbortError') return; // Superseded by a newer request, discard silently
    loading.style.display = 'none';
    list.innerHTML = '<p style="color:#D64000;font-size:.85rem;padding:1rem;">無法載入診次資訊，請稍後再試。</p>';
  }
}

// ── Select session ────────────────────────────────────────────────────────
function selectSession(s, card) {
  document.querySelectorAll('.session-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  selectedSession = s.session;

  const d = new Date(selectedDate + 'T00:00:00');
  document.getElementById('selected-date-label').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（週${DAY_NAMES[d.getDay()]}）`;
  document.getElementById('selected-session-label').textContent =
    `${s.session}　${s.time}`;

  openForm();
}

function openForm() {
  const form = document.getElementById('booking-form-section');
  form.classList.add('open');
  setTimeout(() => form.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

function closeForm() {
  document.getElementById('booking-form-section').classList.remove('open');
  document.getElementById('form-error').style.display = 'none';
  document.querySelectorAll('.session-card').forEach(c => c.classList.remove('selected'));
  selectedVisitType = null;
  document.querySelectorAll('.radio-opt').forEach(o => o.classList.remove('checked'));
}

// ── Submit booking ────────────────────────────────────────────────────────
document.getElementById('submit-btn').addEventListener('click', async () => {
  const name  = document.getElementById('input-name').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  const idNum = document.getElementById('input-id').value.trim().toUpperCase();
  const note  = document.getElementById('input-note').value.trim();
  const err   = document.getElementById('form-error');

  err.style.display = 'none';

  if (!name || !phone || !idNum || !selectedVisitType) {
    err.textContent   = '請填寫所有必填欄位（姓名、電話、身分證字號、初/複診）';
    err.style.display = 'block';
    return;
  }
  if (!selectedDate || !selectedSession) {
    err.textContent   = '請先選擇日期與診次';
    err.style.display = 'block';
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner"></span> 掛號中⋯';

  try {
    const url  = `${SCRIPT_URL}?action=book&date=${selectedDate}&session=${encodeURIComponent(selectedSession)}&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&idNumber=${encodeURIComponent(idNum)}&isFirstVisit=${encodeURIComponent(selectedVisitType)}&note=${encodeURIComponent(note)}`;
    const resp = await fetch(url);
    const data = await resp.json();

    if (data.success) {
      showSuccess(data);
    } else {
      err.textContent   = data.error || '掛號失敗，請稍後再試';
      err.style.display = 'block';
      btn.disabled  = false;
      btn.innerHTML = '確認掛號';
    }
  } catch (e) {
    err.textContent   = '網路錯誤，請稍後再試';
    err.style.display = 'block';
    btn.disabled  = false;
    btn.innerHTML = '確認掛號';
  }
});

function showSuccess(data) {
  document.getElementById('booking-form-section').classList.remove('open');
  const d = new Date(data.date + 'T00:00:00');
  document.getElementById('queue-number').textContent = `#${data.queueNumber}`;
  document.getElementById('success-detail').innerHTML =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日<br>${data.session}`;

  const card = document.getElementById('success-card');
  card.classList.add('show');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetBooking() {
  document.getElementById('success-card').classList.remove('show');
  document.getElementById('input-name').value  = '';
  document.getElementById('input-phone').value = '';
  document.getElementById('input-id').value    = '';
  document.getElementById('input-note').value  = '';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').innerHTML = '確認掛號';
  selectedSession   = null;
  selectedVisitType = null;
  document.querySelectorAll('.radio-opt').forEach(o => o.classList.remove('checked'));
  if (selectedDate) loadSessions(selectedDate);
}

// ── Utility ───────────────────────────────────────────────────────────────
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

buildDateStrip();
</script>
